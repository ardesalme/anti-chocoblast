# Device Detector configuration (Phase 1)
#
# device.method: "ble" | "bluetooth" | "face"
#
#   ble        BLE address scan (e.g. a SmartTag/AirTag)
#     device_id: "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"  # find it with: poetry run scan-devices
#     tx_power: -56                                      # minimum RSSI to count as "present" (higher = closer required)
#
#   bluetooth  classic pairing connection status (e.g. a phone)
#     device_name: "Flip"  # paired device's Bluetooth name (see: system_profiler SPBluetoothDataType)
#
#   face       webcam face recognition
#     face_image: "me.jpg"  # clear, front-facing reference photo
#     camera_index: 0       # which webcam to use (0 = default/built-in)
#     face_tolerance: 0.6   # lower = stricter match (0.4-0.6 typical)

device:
  method: "bluetooth"
  device_name: "Flip"
  timeout: 1
  scan_interval: 1

lock_behavior:
  action: "lock"
  require_password: true
  notification: true

logging:
  level: "INFO"
  file: "/tmp/device_detector.log"
