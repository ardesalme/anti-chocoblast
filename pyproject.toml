[tool.poetry]
name = "smarttag-detector"
version = "1.0.0"
description = "Detects a Samsung SmartTag over BLE and locks the Mac when it's out of range"
authors = ["adesalme <adesalme@pm.me>"]
readme = "README.md"
packages = [{ include = "smarttag_detector" }]

[tool.poetry.dependencies]
python = "~3.11.6"
bleak = "^0.21.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
smarttag-detector = "smarttag_detector.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
