[tool.poetry]
name = "device-detector"
version = "1.0.0"
description = "Detects a nearby BLE device and locks the Mac when it's out of range"
authors = ["adesalme <adesalme@pm.me>"]
readme = "README.md"
packages = [{ include = "device_detector" }]

[tool.poetry.dependencies]
python = "~3.11.6"
bleak = "^0.21.1"
pyyaml = "^6.0"
face-recognition = "^1.3.0"
opencv-python = "^5.0.0.93"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
device-detector = "device_detector.main:main"
scan-devices = "device_detector.scan_devices:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
